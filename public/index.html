<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self'">
<title>Wiztri</title>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/htm.js"></script>
<style>
  :root {
    --bg:#0B1220; --surface:#101B2C; --surface2:#152437; --line:#21334F;
    --text:#E6EDF6; --dim:#8DA1BC; --faint:#7C90AE; /* faint dinaikkan: kontras >=4.5:1 */
    --amber:#FFB454; --teal:#3FD6CB; --red:#FF6B6B;
    --sel:#0F2233; --focus:#3FD6CB;
    --fs-base:13px; --fs-label:12px; --fs-stat:22px; --fs-title:15px;
    --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
    --sans:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font:var(--fs-base)/1.5 var(--sans); overflow:hidden;
    font-variant-numeric:tabular-nums;
  }
  :focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  .stripe { position:relative; background:var(--surface); border-bottom:1px solid var(--line); flex:0 0 auto; }
  .bar { display:flex; gap:10px; padding:12px 16px; align-items:center; }
  .bar input[type=text] {
    flex:1; max-width:460px; background:var(--bg); border:1px solid var(--line);
    color:var(--text); padding:8px 12px; border-radius:8px; font:inherit;
    transition:border-color .12s;
  }
  .bar input[type=text]:hover { border-color:var(--faint); }
  .bar input[type=text]:focus { border-color:var(--focus); }
  .drive {
    background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:8px 10px; border-radius:8px; font:inherit; cursor:pointer;
  }
  .drive:hover { border-color:var(--faint); }
  .open {
    background:transparent; border:0; color:var(--faint); cursor:pointer;
    font-size:13px; padding:6px 9px; border-radius:6px; line-height:1;
    margin-left:6px; vertical-align:middle; min-width:26px; min-height:26px;
  }
  .open:hover { color:var(--teal); background:var(--surface2); }
  .btn {
    background:var(--amber); color:#241503; border:0; font-weight:600;
    padding:8px 18px; border-radius:8px; cursor:pointer; font-size:var(--fs-base);
    transition:filter .12s;
  }
  .btn:hover { filter:brightness(1.08); }
  .btn:disabled { opacity:.45; cursor:wait; }
  .metric { display:flex; gap:2px; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:3px; }
  .tabs { display:flex; gap:2px; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:3px; }
  .tabs button { background:transparent; color:var(--dim); border:0; padding:5px 12px; border-radius:6px; cursor:pointer; font-size:var(--fs-label); font-weight:500; }
  .tabs button.on { background:var(--amber); color:#241503; }
  .find { flex:0 1 200px; min-width:120px; }
  .metric button {
    background:transparent; color:var(--dim); border:0; padding:5px 12px;
    border-radius:6px; cursor:pointer; font-size:var(--fs-label); font-weight:500; transition:background .12s,color .12s;
  }
  .metric button.on { background:var(--teal); color:#062b28; }
  .stats { display:flex; gap:0; padding:8px 16px 10px; align-items:baseline; }
  .stat { margin-right:28px; }
  .stat .v { font-family:var(--mono); font-size:var(--fs-stat); line-height:1.1; font-weight:600; }
  .stat .l { color:var(--dim); font-size:var(--fs-label); margin-top:2px; }
  .stat .v.amber { color:var(--amber); }
  .stat .v.teal { color:var(--teal); }
  .live { color:var(--teal); font-family:var(--mono); font-size:var(--fs-label); margin-left:auto; display:inline-flex; align-items:center; gap:8px; min-width:0; }
  .live .pct { font-weight:600; }
  .live .track { width:110px; height:6px; border-radius:99px; background:var(--surface2); overflow:hidden; flex:0 0 auto; }
  .live .track i { display:block; height:100%; background:linear-gradient(90deg, var(--teal), var(--amber)); transition:width .15s ease; }
  .live .txt { color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #app { height:100%; }
  .cols { display:flex; height:100%; min-height:0; }
  .panel { height:100%; overflow:auto; min-height:0; }
  .panel.right { min-height:220px; }
  .left { flex:1.2; border-right:1px solid var(--line); }
  .right { flex:1; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:right; padding:4px 14px; white-space:nowrap; }
  th:nth-child(1),td:nth-child(1) { text-align:left; }
  thead th {
    color:var(--faint); font-weight:500; font-size:var(--fs-label);
    border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--surface);
  }
  tbody tr { cursor:pointer; transition:background .08s; }
  tbody tr:hover { background:var(--surface2); }
  tbody tr.sel { background:var(--sel); box-shadow:inset 2px 0 0 var(--teal); }
  td.num { font-family:var(--mono); font-size:12px; }
  td.pct { color:var(--dim); font-size:12px; }
  .mark { display:inline-block; width:9px; height:9px; border-radius:2px; margin-left:6px; vertical-align:middle; }
  .mark.err { background:var(--red); } .mark.hidden { background:var(--amber); } .mark.sym { background:var(--teal); }
  .tw { display:inline-block; cursor:pointer; color:var(--faint); width:16px; text-align:center; user-select:none; }
  .spacer { display:inline-block; }
  .sizebar { display:inline-block; height:5px; border-radius:3px; background:var(--teal); margin-left:10px; vertical-align:middle; }
  #tm { position:relative; width:100%; height:100%; }
  .tile { position:absolute; overflow:hidden; border:1px solid rgba(0,0,0,.3); border-radius:3px; cursor:pointer; transition:filter .08s; }
  .tile:hover { filter:brightness(1.22); }
  .tile .t { position:absolute; left:5px; bottom:5px; right:5px; font-size:11px; line-height:1.2; color:#0B1220; font-weight:600; pointer-events:none; word-break:break-all; }
  .tile.dk .t { color:#EAF2FB; }
  .empty { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; padding:0 32px; color:var(--dim); }
  .empty .glyph { font-size:42px; line-height:1; margin-bottom:14px; opacity:.8; }
  .empty h1 { font-size:var(--fs-title); color:var(--text); font-weight:600; margin:0 0 8px; }
  .empty p { max-width:46ch; margin:0 0 18px; }
  .empty .btn { }
  .quiet { color:var(--faint); text-align:center; padding-top:40px; }
  .foot { padding:6px 16px; color:var(--faint); border-top:1px solid var(--line); font-size:var(--fs-label); flex:0 0 auto; }

  /* ---- redesain: tema + compact + gerakan ---- */
  :root {
    /* Kartografi penyimpanan: terrain laut dalam + aksen sinyal.
       Tok di bernama agar konsisten & mudah dijaga kontrasnya. */
    --bg:#070B14; --surface:#0E1624; --surface2:#182338; --line:#1F2E45;
    --text:#E8EFF8; --dim:#93A5C0; --faint:#7087A6;
    --accent-amber:#FFB454; --accent-teal:#3FD6CB; --accent-blue:#7FB4E8;
    --danger:#FF6B6B;
    --amber-soft:rgba(255,180,84,.12); --teal-soft:rgba(63,214,203,.10); --blue-soft:rgba(127,180,232,.10);
    --sel:#10273B; --focus:#4FE3D8;
    --fs-label:11px; --fs-stat:21px; --fs-title:14px;
    --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:14px;
    /* alias lama -> tetap berfungsi */
    --amber:var(--accent-amber); --teal:var(--accent-teal); --blue:var(--accent-blue); --red:var(--danger);
  }
  body { -webkit-font-smoothing:antialiased; }
  .stripe { background:color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .admin-banner { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:7px 14px; font-size:var(--fs-label); color:#241503; background:var(--amber); border-bottom:1px solid var(--line); }
  .admin-banner .tw-admin { margin-left:auto; padding:4px 12px; border-radius:6px; border:0; background:#241503; color:var(--amber); font-weight:650; cursor:pointer; }
  .engine { font-size:11px; font-family:var(--mono); color:var(--dim); border:1px solid var(--line); padding:2px 8px; border-radius:999px; align-self:center; }
  .all-wrap { display:flex; flex-direction:column; height:100%; min-height:0; }
  .all-total { padding:6px 10px; font-size:var(--fs-label); color:var(--dim); border-bottom:1px solid var(--line); flex:0 0 auto; }
  .all { width:100%; border-collapse:collapse; overflow-y:auto; }
  .all th, .all td { padding:3px 8px; text-align:left; white-space:nowrap; }
  .all td.dim-path { color:var(--dim); max-width:360px; overflow:hidden; text-overflow:ellipsis; }
  .all td.num { text-align:right; }
  .bar { padding:9px 14px; }
  .bar input[type=text] { padding:7px 12px; border-radius:var(--r-sm); transition:border-color .15s, box-shadow .15s; }
  .bar input[type=text]:focus { box-shadow:0 0 0 3px var(--teal-soft); }
  .drive { padding:7px 10px; border-radius:var(--r-sm); }
  .btn { padding:7px 18px; border-radius:var(--r-sm); font-weight:650; display:inline-flex; align-items:center; gap:7px; transition:filter .15s, transform .12s; }
  .btn:active { transform:translateY(1px); }
  .btn .spin { display:inline-block; width:12px; height:12px; border:2px solid rgba(36,21,3,.35); border-top-color:#241503; border-radius:50%; animation:rot .8s linear infinite; }
  @keyframes rot { to { transform:rotate(360deg); } }
  .metric { border-radius:var(--r-sm); }
  .metric button { font-weight:550; }
  .stats { gap:22px; padding:9px 16px 11px; }
  .stat { display:flex; align-items:baseline; gap:7px; }
  .stat .v { font-weight:650; letter-spacing:-.01em; }
  .stat .v.blue { color:var(--blue); }
  .live .track { width:120px; }
  .live .track i { transition:width .25s cubic-bezier(.2,.7,.3,1); }
  .live.scan .track i { background:linear-gradient(90deg, var(--surface2), var(--teal) 40%, var(--amber) 60%, var(--surface2)); background-size:220% 100%; animation:shimmer 1.3s linear infinite; }
  @keyframes shimmer { from { background-position:0 0; } to { background-position:-220% 0; } }
  .cols { animation:colIn .45s cubic-bezier(.2,.7,.3,1); }
  @keyframes colIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .panel { scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  .left { flex:1.18; }
  thead th { font-weight:600; z-index:2; }
  tbody tr { transition:background .12s; }
  tbody tr.sel { background:var(--sel); box-shadow:inset 2px 0 0 var(--teal); }
  .mark { width:8px; height:8px; }
  .sizebar { height:4px; background:linear-gradient(90deg, var(--teal), var(--teal)); transition:width .3s ease; }
  .tw { transition:color .12s; } .tw:hover { color:var(--teal); }
  tr.more { color:var(--teal); font-size:12px; }
  tr.more:hover td { background:var(--teal-soft); }
  .tile { border-radius:5px; animation:tileIn .45s cubic-bezier(.2,.7,.3,1) backwards; animation-delay:calc(min(var(--i,0), 10) * 24ms); transition:filter .14s, transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s; }
  .tile:hover { filter:brightness(1.18); transform:scale(1.015); box-shadow:0 6px 18px rgba(0,0,0,.35); z-index:3; }
  @keyframes tileIn { from { opacity:0; transform:scale(.85); } to { opacity:1; transform:scale(1); } }
  .empty .glyph { animation:float 3.4s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-7px); } }
  .empty h1 { font-weight:650; }
  .foot { padding:6px 14px; }
  .th-sort { cursor:pointer; user-select:none; }
  .th-sort:hover { color:var(--text); }
  .th-sort.on { color:var(--teal); }
  .up { position:absolute; top:8px; right:8px; z-index:5; width:26px; height:26px; border-radius:6px;
    border:1px solid var(--line); background:var(--surface2); color:var(--text); font-size:15px;
    cursor:pointer; line-height:1; }
  .up:hover { border-color:var(--teal); color:var(--teal); }
  #tm {
    position:relative;
    /* latar bergaya kisi peta — samar, tidak mengganggu baca tile */
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:24px 24px;
    background-position:-1px -1px;
    background-color:var(--bg);
  }
  .ctx { position:fixed; z-index:200; min-width:150px; background:var(--surface); border:1px solid var(--line);
    border-radius:8px; padding:4px; box-shadow:0 10px 30px rgba(0,0,0,.5); display:flex; flex-direction:column; }
  .ctx button { background:transparent; border:0; color:var(--text); text-align:left; padding:7px 12px;
    border-radius:6px; font-size:13px; cursor:pointer; }
  .ctx button:hover { background:var(--surface2); color:var(--teal); }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
  @media (max-width:900px) {
    .cols { flex-direction:column; }
    .left { flex:1 1 55%; border-right:0; border-bottom:1px solid var(--line); }
    .right { flex:1 1 45%; }
    .stats { flex-wrap:wrap; }
    .live { margin-left:0; width:100%; margin-top:6px; }
    .live .track { flex:1 1 auto; }
  }
  .hidden-skip { position:absolute; left:-9999px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  const { useState, useEffect, useMemo, useReducer, useRef, useCallback } = React;
  const html = htm.bind(React.createElement);
  const W = window.wiztri;

  const fmt = (n) => {
    if (n == null) return '—';
    if (n >= 1e12) return (n/1e12).toFixed(2) + ' TB';
    if (n >= 1e9)  return (n/1e9).toFixed(1) + ' GB';
    if (n >= 1e6)  return (n/1e6).toFixed(1) + ' MB';
    if (n >= 1e3)  return (n/1e3).toFixed(1) + ' KB';
    return n + ' B';
  };

  // Backend Node tidak menghasilkan `alloc`; normalisasi agar mode Allocated
  // jatuh ke `size` (jujur: tak ada info teralokasi terpisah).
  const normalizeAlloc = (n) => {
    if (!n) return n;
    n.alloc = (typeof n.alloc === 'number') ? n.alloc : (n.size || 0);
    (n.children || []).forEach(normalizeAlloc);
    return n;
  };

  // ---- Squarified treemap ----
  function squarify(sizes, x, y, w, h) {
    const out = [];
    if (!sizes.length) return out;
    const total = sizes.reduce((a, b) => a + b, 0);
    if (total <= 0) return out;
    const vals = sizes.map(s => s / total * (w * h)).sort((a, b) => b - a);
    const worst = (row, side) => {
      if (!row.length) return Infinity;
      const s = row.reduce((a, b) => a + b, 0);
      const mn = Math.min(...row), mx = Math.max(...row);
      return Math.max(side * side * mx / (s * s), s * s / (side * side * mn));
    };
    const fillRow = (row, r) => {
      const s = row.reduce((a, b) => a + b, 0);
      if (r.w >= r.h) {
        let y = r.y;
        for (const v of row) { out.push({ x: r.x, y, w: r.w, h: v / r.w }); y += v / r.w; }
        return { x: r.x, y, w: r.w, h: r.h - (y - r.y) };
      } else {
        let x = r.x;
        for (const v of row) { out.push({ x, y: r.y, w: v / r.h, h: r.h }); x += v / r.h; }
        return { x, y: r.y, w: r.w - (x - r.x), h: r.h };
      }
    };
    let r = { x, y, w, h }, i = 0;
    while (i < vals.length) {
      const side = Math.min(r.w, r.h);
      const row = [vals[i]];
      let cur = worst(row, side);
      let j = i + 1;
      while (j < vals.length) {
        const wj = worst([...row, vals[j]], side);
        if (wj <= cur) { row.push(vals[j]); cur = wj; j++; } else break;
      }
      r = fillRow(row, r);
      i = j;
    }
    return out;
  }

  // Palet treemap yang harmonis (amber → teal → biru → slate)
  const TILES = ['#FFB454', '#3FD6CB', '#2E8FB8', '#43618F', '#33415E'];
  const MUTED = '#28364F';
  const tileColor = (i, isAgg) => isAgg ? MUTED : TILES[i % TILES.length];
  const tileDark = (c) => c === '#FFB454' || c === '#3FD6CB';
  const MAX_ROWS = 500; // cap render baris per level (cegah freeze/OOM pada folder raksasa)
  const ALL_RENDER_CAP = 2000; // All Files: maks baris yang dirender sekaligus (anti-OOM, windowed-lite)

  // Warna treemap ala WizTree: file diwarnai berdasarkan ekstensi (hash),
  // folder memakai palet. `ext` hanya huruf kecil.
  const EXT_COLORS = ['#4FC3F7', '#81C784', '#FFB74D', '#E57373', '#BA68C8',
                      '#4DB6AC', '#FFD54F', '#A1887F', '#90A4AE', '#F06292'];
  const extOf = (name) => {
    const i = (name || '').lastIndexOf('.');
    if (i <= 0 || i === name.length - 1) return '';
    return name.slice(i + 1).toLowerCase();
  };
  const extColor = (name) => {
    const e = extOf(name);
    if (!e) return '#3A5068';
    let h = 0;
    for (let k = 0; k < e.length; k++) h = (h * 31 + e.charCodeAt(k)) >>> 0;
    return EXT_COLORS[h % EXT_COLORS.length];
  };
  const isDirNode = (n) => n.dir === true || Array.isArray(n.children);
  const isLight = (hex) => {
    const n = parseInt(hex.slice(1), 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return 0.299 * r + 0.587 * g + 0.114 * b > 160;
  };

  // Pencocok filter: semua token harus muncul (case-insensitive).
  const makeMatch = (q) => {
    const qq = (q || '').trim().toLowerCase();
    if (!qq) return null;
    const toks = qq.split(/\s+/).filter(Boolean);
    return (s) => {
      const t = String(s || '').toLowerCase();
      return toks.every((x) => t.includes(x));
    };
  };

  function Row({ node, depth, total, expanded, selected, metric, onToggle, onSelect, onShowAll, basePath, onCtx }) {
    const isDir = node.dir === true;
    const val = metric === 'alloc' ? (node.alloc ?? node.size) : node.size;
    const pct = total > 0 ? (val / total) * 100 : 0;
    const open = expanded.has(node);
    const ownPath = node.path || (basePath ? (basePath === '\\' ? '\\' + node.name : basePath + '\\' + node.name) : node.name);
    const openPath = (e) => { e.stopPropagation(); if (W && W.openPath) W.openPath(ownPath); };
    return html`
      <React.Fragment>
        <tr className="${selected === node ? 'sel' : ''}"
            tabIndex="0"
            role="row"
            aria-selected="${selected === node}"
            onClick="${() => onSelect(node)}"
            onContextMenu="${(e) => { e.preventDefault(); e.stopPropagation(); if (onCtx) onCtx(e, node); }}"
            onKeyDown="${(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onSelect(node); } }}">
          <td>
            <span className="spacer" style="${{ width: depth * 18 }}"/>
            ${isDir
              ? html`<button className="tw" aria-label="${open ? 'Collapse folder' : 'Expand folder'}" onClick="${(e) => { e.stopPropagation(); onToggle(node); }}">${open ? '▾' : '▸'}</button>`
              : html`<span className="tw"/>`}
            ${node.name}
            ${node.error ? html`<span className="mark err" title="${node.error}"/>` : null}
            ${node.hidden ? html`<span className="mark hidden" title="hidden/system"/>` : null}
            ${node.symlink ? html`<span className="mark sym" title="symlink/junction"/>` : null}
            ${node._truncated ? html`<span className="mark err" title="Folder besar: terbatas pada 2000+ anak (maks respon server)"/>` : null}
            <button className="open" title="Open in Explorer" aria-label="Open in Explorer" onClick="${openPath}">↗</button>
          </td>
          <td className="num">${fmt(val)}</td>
          <td className="pct">${pct.toFixed(pct < 1 && pct > 0 ? 2 : 1)}%</td>
          <td><span className="sizebar" style="${{ width: Math.min(120, pct * 1.2) }}"/></td>
        </tr>
        ${open && node.children
          ? (node._showAll ? node.children : node.children.slice(0, MAX_ROWS)).map((c, i) => html`
              <${Row} key="${depth + ':' + i}" node="${c}" depth="${depth + 1}" total="${total}"
                     expanded="${expanded}" selected="${selected}" metric="${metric}"
                     onToggle="${onToggle}" onSelect="${onSelect}"
                     onShowAll="${onShowAll}" basePath="${ownPath}"/>`)
          : null}
        ${open && node.children && !node._showAll && node.children.length > MAX_ROWS
          ? html`<tr className="more" tabIndex="0" role="button" onClick="${() => onShowAll(node)}" onKeyDown="${(e) => { if (e.key==='Enter'||e.key===' ') onShowAll(node); }}">
              <td colspan="4">⋯ and ${node.children.length - MAX_ROWS} more — Show all</td>
            </tr>`
          : null}
      </React.Fragment>`;
  }

  function App() {
    const [root, setRoot] = useState('C:\\');
    const [busy, setBusy] = useState(false);
    const [tree, setTree] = useState(null);
    const [expanded, setExpanded] = useState(new Set());
    const [selected, setSelected] = useState(null);
    const [metric, setMetric] = useState('size');
    const [prog, setProg] = useState(null);
    const [drives, setDrives] = useState([]);
    const [err, setErr] = useState(null);
    const [showRootMore, setShowRootMore] = useState(false);
    const [scanKey, setScanKey] = useState(0); // naik tiap scan selesai -> animasi masuk ulang
    const [view, setView] = useState('files'); // 'files' | 'types'
    const [filter, setFilter] = useState('');
    const [isAdmin, setIsAdmin] = useState(true);
    const [note, setNote] = useState(null);
    const [engine, setEngine] = useState('node'); // 'mft' | 'node'
    const [allRows, setAllRows] = useState([]);
    const [allTotal, setAllTotal] = useState(0);
    const [allLoading, setAllLoading] = useState(false);
    const allOffsetRef = useRef(0);
    const allToken = useRef(0); // naik tiap load - -> buang respon basi
    const scanToken = useRef(0); // naik tiap scan baru -> buang hasil basi
    const [, bump] = useReducer((x) => x + 1, 0); // paksa re-render setelah muat anak malas
    const [sortKey, setSortKey] = useState('size'); // 'size' | 'alloc' | 'name'
    const [sortAsc, setSortAsc] = useState(false); // default size menurun (ala WizTree)
    const [drill, setDrill] = useState(null); // folder akar treemap (null = root scanned)
    const [ctx, setCtx] = useState(null); // context menu {x,y,node}

    const toggleSort = (k) => {
      if (sortKey === k) setSortAsc((a) => !a);
      else { setSortKey(k); setSortAsc(false); }
    };
    const valOf = (n, m) => m === 'alloc' ? (n.alloc ?? n.size) : n.size;
    const sortList = (list, m) => {
      const arr = [...list];
      const v = (n) => (sortKey === 'name' ? n.name : valOf(n, m));
      arr.sort((a, b) => {
        const x = v(a), y = v(b);
        if (sortKey === 'name') return sortAsc ? String(x).localeCompare(String(y)) : String(y).localeCompare(String(x));
        return sortAsc ? x - y : y - x;
      });
      return arr;
    };

    useEffect(() => {
      if (!W) return;
      return W.onProgress((d) => setProg(d));
    }, []);

    useEffect(() => {
      if (W && W.listDrives) W.listDrives().then(setDrives).catch(() => {});
    }, []);

    useEffect(() => {
      if (W && W.isAdmin) W.isAdmin().then(setIsAdmin).catch(() => {});
    }, []);

    useEffect(() => {
      if (!ctx) return;
      const close = () => setCtx(null);
      window.addEventListener('click', close);
      window.addEventListener('contextmenu', close);
      window.addEventListener('keydown', close);
      return () => { window.removeEventListener('click', close); window.removeEventListener('contextmenu', close); window.removeEventListener('keydown', close); };
    }, [ctx]);

    const logicalTotal = tree ? (tree.size || 0) : 0;
    const allocTotal = tree ? (tree.alloc || 0) : 0;
    const total = metric === 'alloc' ? allocTotal : logicalTotal;

    const items = useMemo(() => {
      if (!tree) return 0;
      let c = 0;
      (function walk(n) { c++; (n.children || []).forEach(walk); })(tree);
      return c;
    }, [tree]);

    const match = useMemo(() => makeMatch(filter), [filter]);

    // Agregasi per ekstensi dari subtree yang sudah dimuat. Folder tidak dihitung;
    // hanya daun file yang masuk bucket, jadi total = jumlah ukuran file sebenarnya.
    const fileTypes = useMemo(() => {
      if (!tree) return [];
      const map = new Map();
      (function walk(n) {
        if (n.dir === true) { (n.children || []).forEach(walk); return; }
        const e = extOf(n.name) || '(no extension)';
        let g = map.get(e);
        if (!g) map.set(e, g = { name: e, size: 0, alloc: 0, count: 0 });
        g.size += n.size || 0;
        g.alloc += (n.alloc ?? n.size) || 0;
        g.count++;
      })(tree);
      const arr = [...map.values()];
      arr.sort((a, b) => (metric === 'alloc' ? b.alloc - a.alloc : b.size - a.size));
      return arr;
    }, [tree, metric]);

    const showAll = (n) => { n._showAll = true; bump(); };

    // ---- "All Files": daftar global semua file (paginasi + filter) ----
    const allBase = (tree && tree.path) || root;
    const loadAll = useCallback(async (reset) => {
      if (!W || !W.filesAll || !allBase) return;
      const tok = ++allToken.current;
      const off = reset ? 0 : allOffsetRef.current;
      setAllLoading(true);
      try {
        const r = await W.filesAll(allBase, off, 500, filter, metric);
        if (tok !== allToken.current) return; // basi (load lain sudah jalan)
        setAllTotal(r.total);
        setAllRows(reset ? r.rows : (p) => [...p, ...r.rows]);
        allOffsetRef.current = off + r.rows.length;
      } catch {} finally { if (tok === allToken.current) setAllLoading(false); }
    }, [W, allBase, filter, metric]);

    useEffect(() => {
      if (view === 'all') { allOffsetRef.current = 0; loadAll(true); }
    }, [view, allBase]);

    useEffect(() => {
      if (view !== 'all' || !W || !W.filesAll) return;
      const id = setTimeout(() => { allOffsetRef.current = 0; loadAll(true); }, 250);
      return () => clearTimeout(id);
    }, [filter, metric]);

    // isi panel kiri dipilih di sini (bukan ternary raksasa di JSX)
    const leftPanel = view === 'all' ? html`
      <div className="all-wrap">
        <div className="all-total">${allTotal.toLocaleString()} files</div>
        <table className="all">
          <thead><tr><th>Name</th><th>Path</th><th>${metric === 'alloc' ? 'Allocated' : 'Size'}</th></tr></thead>
          <tbody>
            ${allRows.slice(0, ALL_RENDER_CAP).map((f, i) => html`
              <tr key="${i}">
                <td>${f.name}</td>
                <td className="dim-path">${f.path}</td>
                <td className="num">${fmt(metric === 'alloc' ? f.alloc : f.size)}</td>
              </tr>`)}
            ${allRows.length > ALL_RENDER_CAP ? html`
              <tr><td colspan="3" className="dim">… hanya ${ALL_RENDER_CAP} baris pertama dirender (${allRows.length} dimuat)</td></tr>` : null}
            ${allLoading ? html`<tr><td colspan="3" className="dim">Loading…</td></tr>` : null}
            ${!allLoading && allRows.length < allTotal ? html`
              <tr className="more" tabIndex="0" role="button" onClick="${() => loadAll(false)}"
                  onKeyDown="${(e) => { if (e.key==='Enter'||e.key===' ') loadAll(false); }}">
                <td colspan="3">⋯ Load more (${allTotal - allRows.length} remaining)</td>
              </tr>` : null}
          </tbody>
        </table>
      </div>` : (view === 'types' ? html`
      <table>
        <thead><tr>
          <th className="${sortKey==='name' ? 'th-sort on' : 'th-sort'}" tabIndex="0" role="button" onClick="${() => toggleSort('name')}" onKeyDown="${(e)=>{ if(e.key==='Enter'||e.key===' ') toggleSort('name'); }}">Type ${sortKey==='name' ? (sortAsc ? '▲' : '▼') : ''}</th>
          <th className="${(sortKey==='size'||sortKey==='alloc') ? 'th-sort on' : 'th-sort'}" tabIndex="0" role="button" onClick="${() => toggleSort(metric)}" onKeyDown="${(e)=>{ if(e.key==='Enter'||e.key===' ') toggleSort(metric); }}">${metric === 'alloc' ? 'Allocated' : 'Size'} ${(sortKey==='size'||sortKey==='alloc') ? (sortAsc ? '▲' : '▼') : ''}</th>
          <th>%</th><th></th>
        </tr></thead>
        <tbody>
          ${(() => {
            let rows = fileTypes.filter((g) => !match || match(g.name));
            rows = sortList(rows, metric).slice(0, MAX_ROWS);
            const denom = total || 1;
            return rows.map((g, i) => html`
              <tr key="${i}" tabIndex="0" role="row">
                <td>
                  <span className="spacer"/>
                  <span className="mark" style="${{ background: extColor(g.name) }}"/>
                  ${g.name}
                  <span className="dim-count"> (${g.count})</span>
                </td>
                <td className="num">${fmt(metric === 'alloc' ? g.alloc : g.size)}</td>
                <td className="pct">${((metric === 'alloc' ? g.alloc : g.size) / denom * 100).toFixed(1) + '%'}</td>
                <td><span className="sizebar" style="${{ width: Math.min(120, ((metric === 'alloc' ? g.alloc : g.size) / denom) * 100 * 1.2) }}"/></td>
              </tr>`);
          })()}
        </tbody>
      </table>` : html`
      <table>
        <thead><tr>
          <th className="${sortKey==='name' ? 'th-sort on' : 'th-sort'}" tabIndex="0" role="button" onClick="${() => toggleSort('name')}" onKeyDown="${(e)=>{ if(e.key==='Enter'||e.key===' ') toggleSort('name'); }}">Name ${sortKey==='name' ? (sortAsc ? '▲' : '▼') : ''}</th>
          <th className="${(sortKey==='size'||sortKey==='alloc') ? 'th-sort on' : 'th-sort'}" tabIndex="0" role="button" onClick="${() => toggleSort(metric)}" onKeyDown="${(e)=>{ if(e.key==='Enter'||e.key===' ') toggleSort(metric); }}">${metric === 'alloc' ? 'Allocated' : 'Size'} ${(sortKey==='size'||sortKey==='alloc') ? (sortAsc ? '▲' : '▼') : ''}</th>
          <th>%</th><th></th>
        </tr></thead>
        <tbody>
          ${(() => {
            let kids = (tree && tree.children) || [];
            if (match) kids = kids.filter((c) => match(c.name));
            kids = sortList(kids, metric);
            const shown = kids.length > MAX_ROWS && !showRootMore ? kids.slice(0, MAX_ROWS) : kids;
            return shown.map((c, i) => html`
              <${Row} key="${i}" node="${c}" depth="${0}" total="${total}"
                     expanded="${expanded}" selected="${selected}" metric="${metric}"
                     onToggle="${toggle}" onSelect="${select}"
                     onShowAll="${showAll}" basePath="${tree.path}"
                     onCtx="${(e, n) => { setCtx({ x: e.clientX, y: e.clientY, node: n }); }}"/>`);
          })()}
          ${tree && tree.children && tree.children.length > MAX_ROWS && !showRootMore ? html`
            <tr className="more" tabIndex="0" role="button" onClick="${() => setShowRootMore(true)}" onKeyDown="${(e) => { if (e.key==='Enter'||e.key===' ') setShowRootMore(true); }}">
              <td colspan="4">⋯ and ${tree.children.length - MAX_ROWS} more — Show all</td>
            </tr>` : null}
        </tbody>
      </table>`);

    async function run(p) {
      const tok = ++scanToken.current;
      setBusy(true); setProg(null); setSelected(null); setExpanded(new Set()); setErr(null); setNote(null);
      setShowRootMore(false); setDrill(null);
      setAllRows([]); setAllTotal(0); allOffsetRef.current = 0; // buang snapshot All Files basi
      try {
        const t = W
          ? await W.scan(p)
          : await fetch('/api/scan?root=' + encodeURIComponent(p)).then(r => { if (!r.ok) throw new Error('scan failed'); return r.json(); });
        if (tok !== scanToken.current) return; // hasil basi (scan baru sudah jalan)
        const n = normalizeAlloc(t);
        setTree(n);
        setScanKey((k) => k + 1);
        if (n && n.error) setErr(String(n.error));
        if (n && n.note) setNote(String(n.note));
        // Cap slice (folder padat) memotong anak langsung -> tandai di bilah bawah.
        if (n && n.truncated) setNote((prev) => (prev ? prev + ' — ' : '') + 'Folder besar di-potong (maks 2000 anak langsung; buka subfolder utk detail).');
        if (n && n.engine) setEngine(n.engine);
      } catch (e) {
        if (tok !== scanToken.current) return;
        setErr(String(e));
        setTree({ name: p, error: String(e), size: 0, children: [] });
      } finally { if (tok === scanToken.current) { setBusy(false); setProg(null); } }
    }

    // Muat anak folder secara malas (lazy) lewat scan(path) — hanya saat dibuka.
    async function ensureChildren(n) {
      if (!n || n.dir !== true || n._loaded || n._loading) return;
      const tok = scanToken.current;
      n._loading = true;
      try {
        const s = W
          ? await W.scan(n.path, { full: true }) // expand subfolder: minta tree penuh
          : await fetch('/api/scan?root=' + encodeURIComponent(n.path)).then(r => r.ok ? r.json() : Promise.reject(new Error('scan failed')));
        if (tok !== scanToken.current) { n._loading = false; return; } // scan baru dimulai -> buang, tidak nyangkut
        n.children = s.children || [];
        n.error = s.error || undefined;
        n._truncated = !!s.truncated || !!s.note;
      } catch (e) {
        if (tok !== scanToken.current) { n._loading = false; return; }
        n.children = [];
        n.error = String(e);
      }
      n._loaded = true;
      n._loading = false;
    }

    async function toggle(n) {
      if (n.dir) { await ensureChildren(n); bump(); }
      setExpanded(prev => { const s = new Set(prev); if (s.has(n)) s.delete(n); else s.add(n); return s; });
    }
    async function select(n) {
      if (n._agg) return;
      if (n.dir) { await ensureChildren(n); bump(); setDrill(n); }
      setSelected(n);
      // Jangan auto-expand folder raksasa (bisa monolitik commit ribuan baris).
      if (n.dir && (n.children || []).length <= MAX_ROWS) setExpanded(prev => new Set(prev).add(n));
    }

    const tmNode = useMemo(() => {
      return (drill && Array.isArray(drill.children)) ? drill : tree;
    }, [tree, drill]);

    const cap200 = (list) => {
      list.sort((a, b) => b.v - a.v);
      if (list.length > 200) {
        const top = list.slice(0, 200);
        const rest = list.slice(200).reduce((s, o) => s + o.v, 0);
        if (rest > 0) top.push({ node: { name: 'Others', size: rest, alloc: rest, _agg: true }, v: rest });
        // Re-sort SETELAH append 'Others' agar urutan tmItems konsisten dengan
        // urutan desc internal squarify — cegah tile<->item misalignment.
        top.sort((a, b) => b.v - a.v);
        list = top;
      }
      return list;
    };

    const tmItems = useMemo(() => {
      if (view === 'types') {
        const rows = fileTypes.filter((g) => !match || match(g.name));
        return cap200(rows.map((g) => ({
          node: { name: g.name, size: g.size, alloc: g.alloc, dir: false },
          v: metric === 'alloc' ? g.alloc : g.size,
        })).filter((o) => o.v > 0));
      }
      const kids = tmNode ? (tmNode.children || []) : [];
      return cap200(kids
        .filter((n) => !match || match(n.name))
        .map((n) => ({ node: n, v: metric === 'alloc' ? (n.alloc ?? n.size) : n.size }))
        .filter((o) => o.v > 0));
    }, [tmNode, metric, view, fileTypes, match]);

    const tiles = useMemo(() => {
      if (!tmItems.length) return [];
      return squarify(tmItems.map(o => o.v), 0, 0, 1, 1);
    }, [tmItems]);

    return html`
      <div style="${{ display:'flex', flexDirection:'column', height:'100%' }}">
        ${!isAdmin ? html`
          <div className="admin-banner" role="status">
            <span>⚠ Non-admin mode — full speed needs MFT; protected folders (System Volume Information, $Recycle.Bin, etc.) are not shown.</span>
            ${W && W.relaunchAdmin ? html`<button className="tw-admin" onClick="${() => W.relaunchAdmin()}">Restart as Administrator</button>` : null}
          </div>` : null}
        <div className="stripe">
          <div className="bar">
            ${drives.length ? html`
              <select className="drive" aria-label="Select drive" value="${root}"
                      onChange="${e => { const v = e.target.value; setRoot(v); run(v); }}">
                ${drives.map(d => html`<option key="${d}" value="${d + '\\'}">${d}</option>`)}
              </select>` : null}
            <input type="text" value="${root}" spellCheck="${false}"
                   aria-label="Folder path or drive"
                   onChange="${e => setRoot(e.target.value)}"
                   onKeyDown="${e => { if (e.key === 'Enter') run(root); }}"/>
            <button className="btn" disabled="${busy}" onClick="${() => run(root)}">${busy ? html`<span class="spin"></span> Scanning…` : 'Scan'}</button>
            <div className="metric" role="group" aria-label="Metric">
              <button className="${metric === 'size' ? 'on' : ''}" onClick="${() => setMetric('size')}">Size</button>
              <button className="${metric === 'alloc' ? 'on' : ''}" onClick="${() => setMetric('alloc')}">Allocated</button>
            </div>
            <div className="tabs" role="group" aria-label="View">
              <button className="${view === 'files' ? 'on' : ''}" onClick="${() => setView('files')}">Files</button>
              <button className="${view === 'types' ? 'on' : ''}" onClick="${() => setView('types')}">File Types</button>
              ${W && W.filesAll ? html`<button className="${view === 'all' ? 'on' : ''}" onClick="${() => setView('all')}">All Files</button>` : null}
            </div>
            <input className="find" type="text" value="${filter}" placeholder="Filter…" aria-label="Filter results"
                   onChange="${e => setFilter(e.target.value)}"/>
          </div>
          ${tree ? html`
            <div className="stats">
              <div className="stat"><div className="v amber">${fmt(logicalTotal)}</div><div className="l">Logical Size</div></div>
              <div className="stat"><div className="v teal">${fmt(allocTotal)}</div><div className="l">Allocated</div></div>
              <div className="stat"><div className="v">${items.toLocaleString()}</div><div className="l">Items</div></div>
              <div className="engine" role="status" aria-label="Scan engine">${engine === 'mft' ? 'MFT' : 'Fallback'}</div>
              ${prog ? html`
                <span className="${'live' + (busy ? ' scan' : '')}">
                  ${prog.total > 0 ? html`
                    <span className="pct">${Math.min(100, Math.round(prog.count / prog.total * 100))}%</span>
                    <span className="track"><i style="${{ width: Math.min(100, prog.count / prog.total * 100) + '%' }}"/></span>` : null}
                  <span className="txt">${prog.count.toLocaleString()}${prog.total > 0 ? ' / ' + prog.total.toLocaleString() : ''} items</span>
                </span>` : null}
            </div>` : null}
        </div>

        ${!tree ? html`
          <div className="empty" role="status" aria-live="polite">
            <div className="glyph" aria-hidden="true">⛁</div>
            <h1>Where to start?</h1>
            <p>Enter a folder path or drive, then press <strong>Scan</strong>. For full scans (including protected folders like <code>System Volume Information</code>) via <code>MFT</code>, run Wiztri as Administrator.</p>
            <button className="btn" onClick="${() => run(root)}">Scan ${root}</button>
          </div>` : html`
          <div className="cols" key="${scanKey}">
            <div className="panel left">
              ${leftPanel}
            </div>
            <div className="panel right">
              ${tmItems.length ? html`
                <div id="tm" key="${metric}">
                  ${drill ? html`<button className="up" onClick="${() => setDrill(null)}" title="Up to root">↑</button>` : null}
                  ${tiles.map((t, i) => {
                    const item = tmItems[i];
                    const isAgg = !!item.node._agg;
                    const col = isAgg ? MUTED : (item.node.dir === true ? tileColor(i, false) : extColor(item.node.name));
                    const tiny = (t.w * t.h) < 0.004; // label disembunyikan utk tile terlalu kecil
                    const onCtx = (e) => { e.preventDefault(); e.stopPropagation(); setCtx({ x: e.clientX, y: e.clientY, node: item.node }); };
                    return html`
                      <div key="${i}" className="${'tile' + (tileDark(col) ? '' : ' dk')}"
                           style="${{ left:(t.x*100)+'%', top:(t.y*100)+'%', width:(t.w*100)+'%', height:(t.h*100)+'%', background:col, ['--i']: i }}"
                           title="${item.node.name + ' — ' + fmt(item.v)}"
                           onClick="${() => select(item.node)}"
                           onContextMenu="${onCtx}"
                           tabIndex="0" role="button" onKeyDown="${(e) => { if (e.key==='Enter'||e.key===' ') select(item.node); }}">
                        ${tiny ? null : html`<span className="t">${item.node.name}</span>`}
                      </div>`;
                  })}
                </div>` : html`<div className="quiet" role="status" aria-live="polite">${selected ? 'Empty folder' : 'No data yet'}</div>`}
            </div>
          </div>`}

        <div className="foot">
          <span>${err ? '⚠ ' + err : (note ? '⚠ ' + note : (tree ? (tree.path || tree.name) : ''))}</span>
        </div>
        ${ctx ? html`
          <div className="ctx" style="${{ left: ctx.x, top: ctx.y }}" role="menu">
            <button role="menuitem" onClick="${() => { if (W && W.openPath) W.openPath(ctx.node.path || ''); setCtx(null); }}">Open in Explorer</button>
            <button role="menuitem" onClick="${() => { if (navigator.clipboard) navigator.clipboard.writeText(ctx.node.path || ''); setCtx(null); }}">Copy path</button>
          </div>` : null}
      </div>`;
  }

  ReactDOM.createRoot(document.getElementById('app')).render(html`<${App}/>`);
})();
</script>
</body>
</html>
